services:
  db:
    image: postgres:15-alpine
    container_name: student_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_rag
    ports:
      - "5451:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: student_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - ./Backend/.env
    environment:
      # Override the DATABASE_URL to use the docker network db container name instead of localhost
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/student_rag
    volumes:
      - ./Backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      # Tell Next.js API routes how to reach the backend inside the Docker network
      - BACKEND_URL=http://backend:8001
      # For client-side API requests if NEXT_PUBLIC is used
      - NEXT_PUBLIC_BACKEND_URL=http://10.10.90.95:8001

volumes:
  postgres_data:
