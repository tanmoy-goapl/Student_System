services:
  db:
    image: postgres:15-alpine
    container_name: student_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_rag
    ports:
      - "5451:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: student_backend
    depends_on:
      db:
        condition: service_healthy
    network_mode: "host"
    env_file:
      - ./Backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5451/student_rag
      - HF_HUB_OFFLINE=1
    volumes:
      - ./Backend:/app
      - /home/galaxy/.cache/huggingface:/root/.cache/huggingface
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_frontend
    ports:
      - "3000:3000"
    environment:
      # Tell Next.js API routes how to reach the backend on the host network
      - BACKEND_URL=http://10.10.90.95:8001
      # For client-side API requests
      - NEXT_PUBLIC_BACKEND_URL=http://10.10.90.95:8001

volumes:
  postgres_data:
